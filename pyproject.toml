[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-sensorimotor-bench"
version = "0.1.0"
description = "Auditable MaleCNS graph importer and deterministic CPU LIF reference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
feather = ["pyarrow>=14"]

[project.scripts]
connectome-bench = "connectome_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
